spring.datasource.url=jdbc:h2:mem:zeitplan-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.cors.allowed-origins=http://localhost:5175
app.dice.roll-zone=Europe/Berlin
app.dice.test-mode=true
app.auth.password=test-password
app.auth.cookie-secret=test-cookie-secret
app.auth.cookie-name=zeitplan_test_session
app.auth.cookie-duration-days=30
app.auth.secure-cookie=false
