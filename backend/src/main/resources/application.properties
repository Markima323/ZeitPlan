spring.application.name=zeitplan-backend
server.port=${SERVER_PORT:8282}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zeitplan}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zeitplan}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zeitplan}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

management.endpoints.web.exposure.include=health,info
server.forward-headers-strategy=framework

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5175,http://127.0.0.1:5175}
app.public-base-url=${APP_PUBLIC_BASE_URL:}
app.dice.roll-zone=${APP_DICE_ROLL_ZONE:Europe/Berlin}
app.dice.test-mode=${APP_DICE_TEST_MODE:false}
app.auth.password=${APP_AUTH_PASSWORD:zeitplan-dev-password}
app.auth.cookie-secret=${APP_AUTH_COOKIE_SECRET:zeitplan-dev-cookie-secret}
app.auth.cookie-name=${APP_AUTH_COOKIE_NAME:zeitplan_session}
app.auth.cookie-duration-days=${APP_AUTH_COOKIE_DURATION_DAYS:90}
app.auth.secure-cookie=${APP_AUTH_SECURE_COOKIE:false}
app.kindle.signing-secret=${APP_KINDLE_SIGNING_SECRET:${app.auth.cookie-secret}}
app.kindle.zone=${APP_KINDLE_ZONE:Europe/Berlin}
app.kindle.current-check-initial-delay-ms=${APP_KINDLE_CURRENT_CHECK_INITIAL_DELAY_MS:5000}
app.kindle.current-check-delay-ms=${APP_KINDLE_CURRENT_CHECK_DELAY_MS:30000}
