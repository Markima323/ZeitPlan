services:
  db:
    image: postgres:16-alpine
    container_name: zeitplan-db-dev
    environment:
      POSTGRES_DB: zeitplan
      POSTGRES_USER: zeitplan
      POSTGRES_PASSWORD: zeitplan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: eclipse-temurin:21-jdk
    container_name: zeitplan-backend-dev
    working_dir: /app
    command: sh /app/scripts/dev-entrypoint.sh
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zeitplan
      SPRING_DATASOURCE_USERNAME: zeitplan
      SPRING_DATASOURCE_PASSWORD: zeitplan
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5175,http://127.0.0.1:5175
      APP_DICE_TEST_MODE: "true"
      SERVER_PORT: "8282"
    ports:
      - "8282:8282"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2

  frontend:
    image: node:24-alpine
    container_name: zeitplan-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://backend:8282
    ports:
      - "5175:5175"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  maven-cache:
  frontend-node-modules:
