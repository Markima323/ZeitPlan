services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      APP_DICE_ROLL_ZONE: ${APP_DICE_ROLL_ZONE}
      APP_DICE_TEST_MODE: ${APP_DICE_TEST_MODE}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD}
      APP_AUTH_COOKIE_SECRET: ${APP_AUTH_COOKIE_SECRET}
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME}
      APP_AUTH_COOKIE_DURATION_DAYS: ${APP_AUTH_COOKIE_DURATION_DAYS}
      APP_AUTH_SECURE_COOKIE: ${APP_AUTH_SECURE_COOKIE}
      APP_KINDLE_SIGNING_SECRET: ${APP_KINDLE_SIGNING_SECRET:-}
      APP_KINDLE_ZONE: ${APP_KINDLE_ZONE:-Europe/Berlin}
      SERVER_PORT: "8282"
    depends_on:
      - db
    expose:
      - "8282"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      SERVER_NAME: ${SERVER_NAME}
      RESUME_SERVER_NAME: ${RESUME_SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - default
      - public-proxy
    command: >
      /bin/sh -c
      "envsubst '$$SERVER_NAME $$RESUME_SERVER_NAME' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
      || exit 1;
      (while :; do sleep 21600; nginx -s reload; done) &
      exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"

networks:
  default:
  public-proxy:
    external: true
    name: ${PUBLIC_PROXY_NETWORK:-public-proxy}

volumes:
  postgres-data:
